<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8e63f"/>
      <stop offset="100%" style="stop-color:#a8c02a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1120"/>
      <stop offset="100%" style="stop-color:#131b2e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Tennis ball -->
  <circle cx="256" cy="256" r="160" fill="url(#ball)"/>
  <!-- Seam curve left -->
  <path d="M136 180 Q176 256 136 332" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <!-- Seam curve right -->
  <path d="M376 180 Q336 256 376 332" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <!-- Accent text -->
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#d4a843">LIVE</text>
</svg>
